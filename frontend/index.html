<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Fonts are served from /fonts (see src/styles/fonts.css): no request leaves the company network. -->
    <link rel="preload" href="/fonts/hanken-grotesk-normal-100-900-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Lotse Intranet</title>
    <meta name="description" content="Lotse, das Intranet: Neuigkeiten, Termine, Dokumente, Schulungen und Kolleg:innen an einem Ort." />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        const t = localStorage.getItem('lotse-theme');
        const dark = t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
        const scheme = localStorage.getItem('lotse-scheme');
        if (scheme) document.documentElement.dataset.scheme = scheme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
